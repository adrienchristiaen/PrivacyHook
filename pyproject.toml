[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privacyhook"
version = "0.1.0"
description = "Privacy-first security layer for AI coding CLIs (Claude Code, Codex, Gemini) via deterministic hooks"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Adrien Christiaen"}]
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
controlplane = ["pyyaml>=6.0"]

[project.scripts]
privacyhook = "privacyhook.cli:main"

[tool.setuptools.packages.find]
include = ["privacyhook*"]

[tool.pytest.ini_options]
testpaths = ["tests", "controlplane/tests"]

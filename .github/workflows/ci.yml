name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,controlplane]"
      - run: python -m pytest -q

  postgres:
    # Same suite with the control plane's Postgres backend exercised.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: privacyhook
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PRIVACYHOOK_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/privacyhook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,controlplane]"
      - run: python -m pytest -q controlplane/tests/test_events_store.py

  deploy-artifacts:
    # The Helm chart, Terraform module and image must stay valid.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/privacyhook-controlplane --set token.value=x
      - run: helm template t deploy/helm/privacyhook-controlplane --set token.value=x > /dev/null
      - run: |
          helm template t deploy/helm/privacyhook-controlplane --set token.value=x \
            --set postgres.url=postgresql://u:p@db/x --set replicaCount=3 --set ingress.enabled=true \
            --set ingress.host=ph.example.com --set serviceMonitor.enabled=true > /dev/null
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=deploy/terraform/privacyhook-controlplane init -backend=false
      - run: terraform -chdir=deploy/terraform/privacyhook-controlplane validate
      - run: terraform fmt -check -recursive deploy/terraform
      - run: docker build -f controlplane/Dockerfile -t privacyhook-controlplane:ci .
